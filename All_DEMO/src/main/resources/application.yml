server:
  port: 7070

spring:
  application:
    name: All-DEMO
  main:
    banner-mode: off

  web:
    error:
      include-message: always # will go to client the real error, only for  debugging propose.

  # DB resources
  datasource:
    url: jdbc:mysql://localhost:3306/student_db
    username: ${DB_USERNAME:root}
    password: ${DB_PASS:Pkswain@123}

  # jmx and actuator for dignosis
  jmx:
    enabling: true


  #jpa
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true # to sql in console with proper formatting
#    show-sql: true

# management- enabling startup tracing
management:
  endpoints:
    web:
      exposure:
        include: "*"

# logging
logging:
  level:
    root: info